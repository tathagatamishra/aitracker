spring.application.name=aitracker

server.port=8083

#  MySQL (same pattern as org-service) 
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/trackerdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:TrackerDev123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#  Cognito JWT (same pool as auth-service & org-service) 
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.ap-southeast-2.amazonaws.com/ap-southeast-2_fxW1EzwhJ}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${COGNITO_JWK_SET_URI:https://cognito-idp.ap-southeast-2.amazonaws.com/ap-southeast-2_fxW1EzwhJ/.well-known/jwks.json}

#  Encryption key (AES-256, base64-encoded — rotate in prod via env var) 
app.encryption.key=${ENCRYPTION_KEY:T3kFLvZ3jd0cCHwo86oGr478LCZHpUTo4cX4byAiTkQ=}

#  org-service base URL (Option A — tracker calls org-service to resolve orgId)
org-service.base-url=${ORG_SERVICE_BASE_URL:http://localhost:8082}

#  Ingestion scheduler 
# Default: every 6 hours (21_600_000 ms).  Override via env var in dev.
app.ingestion.fixed-rate-ms=${INGESTION_RATE_MS:21600000}

#  Actuator 
management.endpoints.web.exposure.include=health